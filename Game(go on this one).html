<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Turbo Toads: Neon Run</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <h1>⚡ Turbo Toads: Neon Run</h1>
    <p>Original platformer — collect coins, stomp bots, and reach the portal!</p>

    <div class="bar">
      <span id="hud">Coins: 0 | Lives: 3</span>
      <button onclick="restart()">Restart</button>
    </div>

    <canvas id="game" width="960" height="540"></canvas>

    <div class="hint">
      Move: A/D or ←/→ · Jump: W / ↑ / Space
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
